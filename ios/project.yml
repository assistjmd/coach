name: Coach
options:
  bundleIdPrefix: com.trainwithcoach
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: "2VDRZ5H7UR"
    # App Store Connect rejects uploads with no 1024px icon (ITMS-90022).
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "28"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: complete

configs:
  Debug: debug
  Release: release

targets:
  Coach:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "*.xcconfig"
    configFiles:
      Debug: App/Config.xcconfig
      Release: App/Config.xcconfig
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Coach Will
        # Baked in at build time and read by APIClient. See App/Config.xcconfig.
        CoachAPIBaseURL: $(COACH_API_BASE_URL)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # GENERATE_INFOPLIST_FILE is NO and this block is written over
        # App/Info.plist on every `xcodegen generate`, so every key must live
        # here — editing the plist directly loses the change on regeneration.
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: "Coach reads your workouts, sleep, heart rate, and HRV from Apple Health to build personalized training plans."
        NSHealthUpdateUsageDescription: "Coach may write activity summaries back to Apple Health."
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - coach
            CFBundleURLName: app.coach.deeplink
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trainwithcoach.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
