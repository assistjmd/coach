name: Backend tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: coach
          POSTGRES_PASSWORD: coach
          POSTGRES_DB: coach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coach -d coach_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://coach:coach@localhost:5432/coach_test
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: ruff check --isolated --select E9,F63,F7,F82 app tests
      - run: python -m pytest tests/ -q
